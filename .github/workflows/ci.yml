name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public:
    runs-on: ubuntu-24.04
    container: gcc:13.3.0-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install Python and Lean prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 unzip zstd
      - name: Check all registered C++ components
        run: python3 tools/check_public.py --mode cpp
      - uses: leanprover/lean-action@v1
        env:
          LEAN_NUM_THREADS: '1'
        with:
          auto-config: 'false'
          build: 'true'
          test: 'false'
          lint: 'false'
          leanchecker: 'true'
          leanchecker-args: 'Proofs'
          axiom-audit: 'true'
          axiom-audit-allow: 'propext,Quot.sound,Classical.choice'
          axiom-audit-root: 'Proofs'
      - name: Check all registered C++ AST to Lean mappings
        run: python3 tools/check_public.py --mode bridge
