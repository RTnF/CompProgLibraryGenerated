name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public:
    runs-on: ubuntu-24.04
    container: gcc:13.3.0-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install Python and Lean prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 unzip zstd git libseccomp2
      - name: Check AST stream boundaries before the proof build
        run: |
          python3 tools/offline.py python3 tests/test_direct_file_ast.py \
            DirectASTTests.test_stream_preserves_raw_roots_across_every_string_boundary \
            DirectASTTests.test_stream_rejects_truncated_strings_and_extra_environments \
            DirectASTTests.test_stream_chunk_boundaries_strings_and_trailer
      - uses: leanprover/lean-action@v1
        env:
          LEAN_NUM_THREADS: '1'
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          leanchecker: 'false'
          axiom-audit: 'false'
          use-mathlib-cache: 'false'
      - name: Fetch Mathlib and its build cache (outside the test path)
        run: lake exe cache get
      - uses: dtolnay/rust-toolchain@1.94.1
      - name: Fetch the pinned proof checkers (outside the test path)
        run: |
          python3 tools/prepare_proof_checkers.py --fetch
      - name: Build the pinned proof checkers without network access
        run: python3 tools/prepare_proof_checkers.py
      - uses: actions/cache@v4
        with:
          path: .cache/axiom-definitions.json
          key: axiom-definitions-${{ hashFiles('verification/allowed_axioms.json', 'lean-toolchain', 'verification/InspectEnvironment.lean', 'tools/proof_security.py') }}
          restore-keys: axiom-definitions-
      - name: Restore independently built imports and successful checks
        id: restore-progress
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/proof-security-scratch/.lake/build
            .cache/ci-check-results.json
          key: public-progress-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'tools/prepare_proof_checkers.py', 'tools/ci_check_cache.py') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            public-progress-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'tools/prepare_proof_checkers.py', 'tools/ci_check_cache.py') }}-${{ github.sha }}-
            public-progress-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'tools/prepare_proof_checkers.py', 'tools/ci_check_cache.py') }}-
      - name: Restore checks while requiring the final proof audit
        id: restore-check-results
        run: python3 tools/offline.py python3 tools/ci_check_cache.py restore
      - name: Trust the checked-out workspace inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check imported-source inventory references and hashes
        run: python3 tools/inventory_imports.py --check
      - name: Verify all public components without network access
        env:
          LEAN_NUM_THREADS: '1'
        run: python3 tools/check_public.py --timeout-seconds 7200
      - name: Build and verify the header-only archive
        run: |
          python3 tools/offline.py python3 tools/package_headers.py --output "$RUNNER_TEMP/library-hpp.zip"
          python3 tools/check_header_package.py "$RUNNER_TEMP/library-hpp.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: library-hpp
          path: ${{ runner.temp }}/library-hpp.zip
          if-no-files-found: error
      - name: Snapshot successful checks from this main run
        id: snapshot-progress
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.restore-check-results.outcome == 'success'
        run: python3 tools/offline.py python3 tools/ci_check_cache.py snapshot
      - name: Preserve completed work even when a later check fails
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.snapshot-progress.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/proof-security-scratch/.lake/build
            .cache/ci-check-results.json
          key: public-progress-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'tools/prepare_proof_checkers.py', 'tools/ci_check_cache.py') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

  release-headers:
    needs: verify-public
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-headers
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: library-hpp
          path: ${{ runner.temp }}/headers
      - name: Update the header-only release
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh tools/release_headers.sh "$RUNNER_TEMP/headers/library-hpp.zip"
